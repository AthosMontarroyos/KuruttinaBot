name: Publicar produção

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag ou SHA para publicar ou restaurar
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Verificações de qualidade
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read

  deploy:
    name: Publicar na VPS
    needs: quality
    if: always() && (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' || github.event_name == 'workflow_dispatch' && needs.quality.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Preparar acesso SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "Os segredos VPS_HOST, VPS_USER e VPS_SSH_KEY precisam estar configurados no ambiente production."
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "O segredo VPS_KNOWN_HOSTS está vazio. Configure a chave de host fixada no ambiente production."
            exit 1
          fi
          key_dir="${RUNNER_TEMP}/ssh"
          mkdir -p "${key_dir}"
          chmod 700 "${key_dir}"
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > "${key_dir}/id"
          chmod 600 "${key_dir}/id"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          if [ ! -s "${HOME}/.ssh/known_hosts" ]; then
            echo "O segredo VPS_KNOWN_HOSTS está vazio. Configure a chave de host fixada no ambiente production."
            exit 1
          fi

      - name: Publicar o commit na VPS
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_run' && 'sha' || 'manual' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_REF}" ]; then
            echo "Nenhuma referência foi informada."
            exit 1
          fi
          if [[ "${DEPLOY_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            DEPLOY_REF="${DEPLOY_REF,,}"
          elif [[ ! "${DEPLOY_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${DEPLOY_REF}" == *".."* ]] || [[ "${DEPLOY_REF}" == -* ]]; then
            echo "A referência informada é inválida."
            exit 1
          fi
          if [ "${DEPLOY_MODE}" = "sha" ] && [[ ! "${DEPLOY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "O commit da Quality não é um SHA de 40 caracteres."
            exit 1
          fi
          ssh -T \
            -i "${RUNNER_TEMP}/ssh/id" \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- "${DEPLOY_REF}" "${DEPLOY_MODE}" <<'REMOTE' | tee "${RUNNER_TEMP}/deploy.log"
          set -euo pipefail
          cd /home/deploy/Projects/KuruttinaBot
          ref="$1"
          mode="$2"

          require_runtime_databases() {
            local name status missing=""
            for name in SITE_DATABASE_URL DATABASE_URL; do
              status=0
              doppler run -- bash -c 'value="${!1-}"
              value="${value//$'\''\r'\''/}"
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
              if [ -z "${value}" ]; then exit 4; fi' bash "${name}" || status=$?
              if [ "${status}" -eq 4 ]; then
                missing="${missing:+${missing}, }${name}"
                continue
              fi
              if [ "${status}" -ne 0 ]; then
                echo "Não foi possível ler ${name}. Os contêineres em execução não foram alterados."
                return 2
              fi
            done
            if [ -n "${missing}" ]; then
              echo "Segredos ausentes ou vazios: ${missing}. Os contêineres em execução não foram alterados."
              return 1
            fi
          }

          migration_configured() {
            local value status=0
            value="$(doppler secrets get DATABASE_MIGRATION_URL --plain --no-exit-on-missing-secret 2>/dev/null)" || status=$?
            if [ "${status}" -ne 0 ]; then
              return 2
            fi
            value="${value//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [ -n "${value}" ]; then
              return 0
            fi
            return 1
          }

          restore_checkout() {
            git checkout --detach "${prev}"
          }

          restore_built_images() {
            git checkout --detach "${prev}"
            if ! doppler run -- docker compose build; then
              echo "Não foi possível reconstruir as imagens do commit anterior. Os contêineres em execução não foram recriados."
              exit 1
            fi
          }

          rollback_activation() {
            echo "A ativação falhou. Restaurando o commit anterior."
            git checkout --detach "${prev}"
            doppler run -- docker compose build && doppler run -- docker compose up -d bot site
            exit 1
          }

          if [ -z "${ref}" ]; then
            echo "Nenhuma referência foi informada."
            exit 1
          fi
          if [ "${mode}" != "sha" ] && [ "${mode}" != "manual" ]; then
            echo "O modo de publicação é inválido."
            exit 1
          fi
          if [[ "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            ref="${ref,,}"
          fi
          if [ "${mode}" = "sha" ] && [[ ! "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "O commit informado não é um SHA de 40 caracteres."
            exit 1
          fi
          if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v doppler >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            echo "A VPS precisa de git, curl, docker compose e doppler. Nenhum contêiner foi alterado."
            exit 1
          fi
          if ! doppler secrets --only-names >/dev/null; then
            echo "O Doppler não está configurado neste diretório para o usuário deploy. Nenhum contêiner foi alterado."
            exit 1
          fi

          prev=$(git rev-parse HEAD)
          git fetch --tags --prune origin
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "origin/main não está disponível depois do fetch."
            exit 1
          fi
          if [[ "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
            if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
              echo "O commit ${ref} não está no repositório."
              exit 1
            fi
            resolved="${ref}"
          else
            if ! git check-ref-format --allow-onelevel "refs/tags/${ref}"; then
              echo "A referência informada é inválida."
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${ref}^{commit}" >/dev/null; then
              echo "A tag ${ref} não existe no repositório."
              exit 1
            fi
            resolved=$(git rev-parse "refs/tags/${ref}^{commit}")
          fi
          if ! git merge-base --is-ancestor "${resolved}" origin/main; then
            echo "O commit ${resolved} não é alcançável a partir de origin/main."
            exit 1
          fi
          if [ "${mode}" = "sha" ] && [ "${resolved}" != "${prev}" ] && git merge-base --is-ancestor "${resolved}" "${prev}"; then
            echo "O commit ${resolved} já está no checkout atual. A publicação automática não volta para um commit anterior."
            exit 1
          fi
          git checkout --detach "${resolved}"

          if ! require_runtime_databases; then
            echo "SITE_DATABASE_URL e DATABASE_URL precisam estar preenchidos no Doppler. Os valores não são impressos. Os contêineres em execução não foram alterados."
            restore_checkout
            exit 1
          fi

          if ! doppler run -- docker compose build; then
            echo "A construção das imagens falhou. Os contêineres em execução não foram alterados."
            restore_checkout
            exit 1
          fi

          migration_status=0
          migration_configured || migration_status=$?
          if [ "${migration_status}" -eq 2 ]; then
            echo "Não foi possível ler DATABASE_MIGRATION_URL. Os contêineres em execução não foram recriados."
            restore_built_images
            exit 1
          fi
          if [ "${migration_status}" -eq 0 ]; then
            if ! doppler run -- docker compose --profile release build migrate; then
              echo "A construção da imagem de migration falhou. Os contêineres em execução não foram recriados."
              restore_built_images
              exit 1
            fi
            if ! doppler run -- docker compose --profile release run --rm migrate; then
              echo "A migration falhou. Os contêineres em execução não foram recriados."
              restore_built_images
              exit 1
            fi
          else
            echo "Migration ignorada: DATABASE_MIGRATION_URL ausente ou vazio."
          fi

          if ! doppler run -- docker compose up -d bot site; then
            rollback_activation
          fi

          umask 077
          log_file=$(mktemp)
          trap 'rm -f "${log_file}"' EXIT
          deadline=$((SECONDS + 120))
          ready=0
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            bot_ok=0
            site_ok=0
            if doppler run -- docker compose logs bot >"${log_file}" 2>&1 && grep -F -q 'Bot pronto' "${log_file}"; then
              bot_ok=1
            fi
            http_code=$(curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' https://kuruttina.athosmontarroyos.com/healthz || true)
            if [ "${http_code}" = "200" ]; then
              site_ok=1
            fi
            if [ "${bot_ok}" -eq 1 ] && [ "${site_ok}" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "${ready}" -ne 1 ]; then
            echo "A publicação não ficou saudável em 120s. Restaurando o commit anterior."
            doppler run -- docker compose logs site bot --tail 100 || echo "Não foi possível ler os logs de site e bot."
            rollback_activation
          fi

          if ! docker image prune -f; then
            echo "A limpeza de imagens não utilizadas falhou e foi ignorada."
          fi

          printf 'KURUTTINA_DEPLOYED_REF=%s\n' "${ref}"
          printf 'KURUTTINA_DEPLOYED_COMMIT=%s\n' "$(git rev-parse HEAD)"
          REMOTE
          commit=$(grep -E '^KURUTTINA_DEPLOYED_COMMIT=[0-9a-f]{40}$' "${RUNNER_TEMP}/deploy.log" | tail -n 1 | cut -d= -f2 || true)
          deployed_ref=$(grep -E '^KURUTTINA_DEPLOYED_REF=' "${RUNNER_TEMP}/deploy.log" | tail -n 1 | cut -d= -f2- || true)
          if [ -z "${commit}" ] || [ "${deployed_ref}" != "${DEPLOY_REF}" ]; then
            echo "A publicação não confirmou a referência e o commit."
            exit 1
          fi
          {
            echo "## Publicação"
            echo
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- Commit: \`${commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apagar chave SSH
        if: always()
        run: rm -f "${RUNNER_TEMP}/ssh/id" "${HOME}/.ssh/known_hosts"

      - name: Registrar falha da publicação
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Publicação"
            echo
            echo "A publicação de \`${DEPLOY_REF}\` falhou."
          } >> "${GITHUB_STEP_SUMMARY}"
