name: Adicionar emoji de produção

# Manual. O ambiente production precisa de revisores obrigatórios: cada execução
# espera a aprovação deles antes de usar o segredo. O workflow só cria o emoji.
# A origem é um ID de emoji do Discord ou uma URL HTTPS. A imagem fica só em
# memória e não entra no repositório.
# DOPPLER_TOKEN do ambiente GitHub production é usado só aqui.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Nome do emoji (2 a 32 caracteres, A-Z, a-z, 0-9 ou _)
        required: true
        type: string
      source:
        description: ID de um emoji do Discord ou URL HTTPS do CDN
        required: true
        type: string

permissions:
  contents: read

concurrency: emoji-prod

jobs:
  create:
    name: Criar Application Emoji
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --engine-strict

      - name: Compilar o bot
        run: npm run build

      - name: Instalar Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Criar emoji
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EMOJI_NAME: ${{ inputs.name }}
          EMOJI_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "O segredo DOPPLER_TOKEN não está configurado no ambiente production."
            exit 1
          fi
          if [ -z "${EMOJI_SOURCE}" ]; then
            echo "Informe o ID de um emoji do Discord ou uma URL HTTPS."
            exit 1
          fi
          doppler run --only-secrets DISCORD_BOT_TOKEN -- node scripts/add-production-emoji.ts
