name: Publicar comandos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publicar comandos na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Preparar acesso SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "Os segredos VPS_HOST, VPS_USER e VPS_SSH_KEY precisam estar configurados no ambiente production."
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "O segredo VPS_KNOWN_HOSTS está vazio. Configure a chave de host fixada no ambiente production."
            exit 1
          fi
          key_dir="${RUNNER_TEMP}/ssh"
          mkdir -p "${key_dir}"
          chmod 700 "${key_dir}"
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > "${key_dir}/id"
          chmod 600 "${key_dir}/id"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          if [ ! -s "${HOME}/.ssh/known_hosts" ]; then
            echo "O segredo VPS_KNOWN_HOSTS está vazio. Configure a chave de host fixada no ambiente production."
            exit 1
          fi

      - name: Publicar comandos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -T \
            -i "${RUNNER_TEMP}/ssh/id" \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/Projects/KuruttinaBot
          docker compose run --rm --no-deps bot node dist/apps/bot/src/deployments/deploy-central.js
          REMOTE

      - name: Apagar chave SSH
        if: always()
        run: rm -f "${RUNNER_TEMP}/ssh/id" "${HOME}/.ssh/known_hosts"
