name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    name: Typecheck, test, and build bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install --yes postgresql

      - name: Test PostgreSQL privileges and RLS
        run: npm run test:database

      - name: Build bot
        run: npm run build:bot
