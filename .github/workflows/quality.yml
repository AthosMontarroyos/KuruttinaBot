name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    name: Typecheck, test, and build bot and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --engine-strict

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test PostgreSQL privileges and RLS
        run: npm run test:database

      - name: Build bot and site
        run: npm run build:all
