# Standalone: doppler run -- docker compose -f compose.dev.yaml up --build -d
# Doppler injects unsuffixed secrets into this process. Compose passes only the keys below.
# APP_ENV, HOST, PORT and SITE_URL are fixed here, not in Doppler.
name: kuruttina-dev

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: kuruttina-bot:development
    container_name: kuruttina-bot-dev
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_ENV: development
      AUTO_SYNC_COMMANDS: "false"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_ID: ${DISCORD_BOT_ID:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA: ${DATABASE_CA:-}

  site:
    build:
      context: .
      dockerfile: Dockerfile
      target: site
    image: kuruttina-site:development
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: "3667"
      SITE_URL: http://localhost:3667
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:-}
    ports:
      - "127.0.0.1:3667:3667"
