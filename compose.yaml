name: kuruttina

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: kuruttina-bot
    container_name: kuruttina-bot
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_ENV: production
      AUTO_SYNC_COMMANDS: "false"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_ID: ${DISCORD_BOT_ID:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA: ${DATABASE_CA:-}

  site:
    build:
      context: .
      dockerfile: Dockerfile
      target: site
    image: kuruttina-site
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_ENV: production
      AUTO_SYNC_COMMANDS: "false"
      HOST: 0.0.0.0
      PORT: "3666"
      SITE_URL: https://kuruttina.athosmontarroyos.com
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:-}
    ports:
      - "127.0.0.1:3666:3666"

  migrate:
    profiles:
      - release
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    image: kuruttina-release
    restart: "no"
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      DATABASE_CA: ${DATABASE_CA:-}
    command: ["node", "packages/database/cli.js", "migrate", "production"]
