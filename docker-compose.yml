services:
  bot-development:
    profiles: [development]
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    environment:
      APP_ENV: development
      AUTO_SYNC_COMMANDS: ${AUTO_SYNC_COMMANDS:-false}
      DISCORD_BOT_ID_DEVELOPMENT: ${DISCORD_BOT_ID_DEVELOPMENT:-}
      DISCORD_BOT_ID_PRODUCTION: ${DISCORD_BOT_ID_PRODUCTION:-}
      DISCORD_BOT_TOKEN_DEVELOPMENT: ${DISCORD_BOT_TOKEN_DEVELOPMENT:-}
      DISCORD_BOT_TOKEN_PRODUCTION: ${DISCORD_BOT_TOKEN_PRODUCTION:-}
    command: ["node", "dist/apps/bot/src/runner.js", "development"]
    restart: "no"
    mem_limit: 500m
    cpus: 1.0
  bot-production:
    profiles: [production]
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    environment:
      APP_ENV: production
      AUTO_SYNC_COMMANDS: ${AUTO_SYNC_COMMANDS:-false}
      DISCORD_BOT_ID_DEVELOPMENT: ${DISCORD_BOT_ID_DEVELOPMENT:-}
      DISCORD_BOT_ID_PRODUCTION: ${DISCORD_BOT_ID_PRODUCTION:-}
      DISCORD_BOT_TOKEN_DEVELOPMENT: ${DISCORD_BOT_TOKEN_DEVELOPMENT:-}
      DISCORD_BOT_TOKEN_PRODUCTION: ${DISCORD_BOT_TOKEN_PRODUCTION:-}
    command: ["node", "dist/apps/bot/src/runner.js", "production"]
    restart: "no"
    mem_limit: 500m
    cpus: 1.0
