services:
  bot-development:
    profiles: [development]
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL_DEVELOPMENT: ${DATABASE_URL_DEVELOPMENT:-}
      DATABASE_CA_CERT_DEVELOPMENT: ${DATABASE_CA_CERT_DEVELOPMENT:-}
      AUTO_SYNC_COMMANDS: ${AUTO_SYNC_COMMANDS:-false}
      DISCORD_BOT_ID_DEVELOPMENT: ${DISCORD_BOT_ID_DEVELOPMENT:-}
      DISCORD_BOT_ID_PRODUCTION: ${DISCORD_BOT_ID_PRODUCTION:-}
      DISCORD_BOT_TOKEN_DEVELOPMENT: ${DISCORD_BOT_TOKEN_DEVELOPMENT:-}
      DISCORD_BOT_TOKEN_PRODUCTION: ${DISCORD_BOT_TOKEN_PRODUCTION:-}
    command: ["node", "dist/apps/bot/src/runner.js", "development"]
    restart: "no"
    mem_limit: 500m
    cpus: 1.0
  bot-production:
    profiles: [production]
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL_PRODUCTION: ${DATABASE_URL_PRODUCTION:-}
      DATABASE_CA_CERT_PRODUCTION: ${DATABASE_CA_CERT_PRODUCTION:-}
      AUTO_SYNC_COMMANDS: ${AUTO_SYNC_COMMANDS:-false}
      DISCORD_BOT_ID_DEVELOPMENT: ${DISCORD_BOT_ID_DEVELOPMENT:-}
      DISCORD_BOT_ID_PRODUCTION: ${DISCORD_BOT_ID_PRODUCTION:-}
      DISCORD_BOT_TOKEN_DEVELOPMENT: ${DISCORD_BOT_TOKEN_DEVELOPMENT:-}
      DISCORD_BOT_TOKEN_PRODUCTION: ${DISCORD_BOT_TOKEN_PRODUCTION:-}
    command: ["node", "dist/apps/bot/src/runner.js", "production"]
    restart: "no"
    mem_limit: 500m
    cpus: 1.0

  postgres:
    profiles: [local-database]
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:-}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:54329:5432"]
    volumes: [kuruttina-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
volumes:
  kuruttina-postgres:
